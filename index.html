
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kajun Cowboy Recipe Box</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <main class="container py-5">
        <h1 class="mb-4">Kajun Cowboy Recipe Box</h1>

        <!-- Find a Recipe -->
        <section class="mb-5">
            <h2>Find a Recipe</h2>

            <div class="d-flex gap-2 mb-3">
                <input id="recipe-id" type="number"
                       class="form-control" value="1" min="1">

                <button id="get-btn" class="btn btn-dark">
                    Get recipe
                </button>
            </div>

            <p id="status" class="fw-bold text-danger"></p>
            <div id="recipe"></div>
        </section>

        <!-- Add a Dish -->
        <section>
            <h2>Add a Dish</h2>

            <div class="d-flex gap-2 mb-3">
                <input id="dish-name" type="text"
                       class="form-control"
                       placeholder="New dish name">

                <button id="post-btn" class="btn btn-warning">
                    Add it
                </button>
            </div>

            <p id="post-status" class="fw-bold text-danger"></p>
            <div id="saved"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
